name: g4wdb_ai_agent
description: G4WDB AI Agent - Offline Humanitarian Response System
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # =========================
  # STATE MANAGEMENT
  # =========================
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # =========================
  # DATABASE
  # =========================
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.2
  path: ^1.8.3
  path_provider: ^2.1.1

  # =========================
  # AI / ML (OCR ONLY)
  # =========================
  tflite_flutter: ^0.12.0

  # ✅ ONLY ML KIT USED (NO CONFLICT)
  google_mlkit_text_recognition: ^0.15.1

  # =========================
  # BLUETOOTH & MESH
  # =========================
  flutter_blue_plus: ^2.2.1
  nearby_connections: ^4.3.0

  # =========================
  # CAMERA & IMAGE PROCESSING
  # =========================
  camera: ^0.10.5+9
  image: ^4.1.7
  image_picker: ^1.0.5

  # =========================
  # VOICE & AUDIO
  # =========================
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.0
  record: ^6.0.0

  # =========================
  # SENSORS & FEEDBACK
  # =========================
  vibration: ^3.1.8
  sensors_plus: ^4.0.1

  # =========================
  # LOCALIZATION (SDK PINNED)
  # =========================
  intl: 0.20.2
  easy_localization: ^3.0.3

  # =========================
  # UTILITIES
  # =========================
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  battery_plus: ^5.0.2
  permission_handler: ^11.1.0
  flutter_native_splash: ^2.3.8
  dio: ^5.4.0

  # =========================
  # UI COMPONENTS
  # =========================
  flutter_animate: ^4.3.0
  lottie: ^2.7.0
  shimmer: ^3.0.0

  # =========================
  # SECURITY
  # =========================
  encrypt: ^5.0.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/databases/
    - assets/images/
    - assets/sounds/
    - assets/translations/